# yaml-language-server: $schema=https://lefthook.dev/schema.json
#
# Centralized lefthook configuration for github.com/inful/* repositories.
# Source: https://github.com/inful/lefthooks
#
# ────────────────────────────────────────────────────────────────────────────
# Design: every hook self-gates. A consumer's pre-commit runs only the hooks
# whose preconditions match the staged files and project shape:
#
#   • `glob:`    auto-skip the command when no staged files match the pattern.
#   • `skip:`    additional shell-conditional skips (tool missing, go.mod
#                absent, sqlc.yaml absent, ...).
#
# Result: any consumer repo that imports this file via `remotes:` picks up
# exactly the hooks that apply to it — Go projects get Go checks, projects
# with .md files get markdownlint, projects with sqlc.yaml get the sqlc
# drift check, and so on. No per-repo configuration needed.
#
# See README.md for the consumer wiring instructions.
# ────────────────────────────────────────────────────────────────────────────

min_version: 2.1.0
source_dir: .lefthook

# Use the standard "**" semantics (zero or more directories), so a glob
# like "**/*" matches files at any depth, not just nested ones.
glob_matcher: doublestar

# ────────────────────────────────────────────────────────────────────────────
# pre-commit: cheap, fast, parallel. Per-staged-file checks.
# ────────────────────────────────────────────────────────────────────────────
pre-commit:
  parallel: true
  commands:
    # ─── Go ───────────────────────────────────────────────────────────────
    # Each runs only when *.go files are staged AND a go.mod exists AND the
    # tool is on PATH.

    gofmt:
      glob: "*.go"
      run: gofmt -l {staged_files} | (! grep .)
      stage_fixed: true
      skip:
        - run: "! command -v gofmt"
        - run: "test ! -f go.mod"

    govet:
      glob: "*.go"
      run: go vet ./...
      skip:
        - run: "! command -v go"
        - run: "test ! -f go.mod"

    golangci-lint:
      glob: "*.go"
      run: golangci-lint run --timeout 5m ./...
      skip:
        - run: "! command -v golangci-lint"

    go-test:
      glob: "*.go"
      run: go test -race -count=1 -short ./...
      skip:
        - run: "! command -v go"
        - run: "test ! -f go.mod"

    # ─── Markdown ─────────────────────────────────────────────────────────
    # Runs only when *.md files are staged.

    markdownlint:
      glob: "*.md"
      run: markdownlint {staged_files}
      skip:
        - run: "! command -v markdownlint"

    # ─── SQL (sqlc) ───────────────────────────────────────────────────────
    # Drift check only fires when both *.sql files are staged AND sqlc.yaml
    # is present in the consumer repo.

    sqlc-check:
      glob: "*.sql"
      run: |
        if [ -f sqlc.yaml ]; then
          sqlc generate
          if ! git diff --exit-code -- . >/dev/null; then
            echo "sqlc generated code is out of date — run 'sqlc generate' and commit the result." >&2
            git diff --stat -- .
            exit 1
          fi
        else
          echo "sqlc.yaml not present — skipping"
        fi
      skip:
        - run: "! command -v sqlc"

    # ─── DocBuilder content lint ───────────────────────────────────────────
    # Lints staged documentation files (Markdown + image assets) using
    # the docbuilder binary when available, falling back to a local
    # `go run ./cmd/docbuilder` in dev mode. Silently skips on consumers
    # where docbuilder isn't installed and no local fallback exists.

    docbuilder-lint:
      glob:
        - "*.md"
        - "*.markdown"
        - "*.png"
        - "*.jpg"
        - "*.jpeg"
        - "*.gif"
        - "*.svg"
      run: |
        DOCBUILDER_CMD=""
        if command -v docbuilder >/dev/null 2>&1; then
          DOCBUILDER_CMD="docbuilder"
        elif [ -f go.mod ] && grep -q "docbuilder" go.mod; then
          DOCBUILDER_CMD="go run ./cmd/docbuilder"
        else
          echo "⚠️  docbuilder binary not found and no local cmd/docbuilder present — skipping documentation linting"
          echo "   Install: go install git.home.luguber.info/inful/docbuilder/cmd/docbuilder@latest"
          exit 0
        fi

        TEMP_DIR=$(mktemp -d)
        trap 'rm -rf "${TEMP_DIR}"' EXIT

        # Stage the to-be-committed versions of each file (preserving path
        # structure) into a temp dir so docbuilder can lint them as a tree.
        for f in {staged_files}; do
          mkdir -p "${TEMP_DIR}/$(dirname "$f")"
          git show ":$f" > "${TEMP_DIR}/$f"
        done

        "$DOCBUILDER_CMD" lint "${TEMP_DIR}" --quiet
      skip:
        # Skip silently when neither the binary nor a local cmd/docbuilder
        # is available, so non-docbuilder consumers don't see noise on
        # every commit.
        - run: "! command -v docbuilder && ! ([ -f go.mod ] && grep -q docbuilder go.mod)"

    # ─── typos-cli ────────────────────────────────────────────────────────
    # Spell-checks staged content with crate-ci/typos. Tool auto-detects
    # text vs binary; honors _typos.toml / typos.toml if present.

    typos:
      glob: "**/*"
      run: typos {staged_files}
      skip:
        - run: "! command -v typos"

    # ─── gitleaks ─────────────────────────────────────────────────────────
    # Secret detection on staged content. Honors .gitleaks.toml if present;
    # runs with default rules otherwise.

    gitleaks:
      glob: "**/*"
      run: gitleaks protect --staged --redact
      skip:
        - run: "! command -v gitleaks"

    # ─── shellcheck ───────────────────────────────────────────────────────
    # Lints staged shell scripts.

    shellcheck:
      glob:
        - "*.sh"
        - "*.bash"
        - "*.zsh"
        - "*.ksh"
      run: shellcheck {staged_files}
      skip:
        - run: "! command -v shellcheck"

    # ─── actionlint ───────────────────────────────────────────────────────
    # Validates GitHub Actions workflows. Only fires when .github/workflows/
    # exists in the consumer.

    actionlint:
      glob:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
      run: actionlint
      skip:
        - run: "! command -v actionlint"
        - run: "test ! -d .github/workflows"

    # ─── hadolint ─────────────────────────────────────────────────────────
    # Lints staged Dockerfiles.

    hadolint:
      glob:
        - "Dockerfile"
        - "Dockerfile.*"
        - "*.dockerfile"
        - "*.Dockerfile"
      run: hadolint {staged_files}
      skip:
        - run: "! command -v hadolint"

    # ─── Inline: merge-conflict markers ───────────────────────────────────
    # Blocks commits with unresolved <<<<<<< / ======= / >>>>>>> markers.
    # No external tool needed.

    check-merge-conflicts:
      glob: "**/*"
      run: |
        matches=$(grep -lE '^(<<<<<<<|=======$|>>>>>>>)' {staged_files} 2>/dev/null || true)
        if [ -n "$matches" ]; then
          echo "ERROR: staged files contain unresolved merge conflict markers:" >&2
          echo "$matches" >&2
          exit 1
        fi

    # ─── Inline: trailing whitespace ───────────────────────────────────────
    # Blocks commits with lines ending in spaces or tabs. Skip binary-ish
    # extensions (image, video, audio, archive) since trailing bytes there
    # are legitimate.

    check-trailing-whitespace:
      glob: "**/*"
      run: |
        matches=$(grep -lE '[[:space:]]+$' \
          --include='*.go' --include='*.md' --include='*.txt' \
          --include='*.yml' --include='*.yaml' --include='*.json' \
          --include='*.toml' --include='*.sh' --include='*.bash' \
          --include='*.py' --include='*.rs' --include='*.ts' \
          --include='*.js' --include='*.tsx' --include='*.jsx' \
          --include='*.html' --include='*.css' --include='Makefile' \
          --include='*.mk' --include='Dockerfile*' --include='*.cfg' \
          --include='*.ini' \
          {staged_files} 2>/dev/null || true)
        if [ -n "$matches" ]; then
          echo "ERROR: trailing whitespace in:" >&2
          echo "$matches" >&2
          echo "Fix with: sed -i '' 's/[[:space:]]*\$//' <file>" >&2
          exit 1
        fi

    # ─── Inline: large files ──────────────────────────────────────────────
    # Blocks commits with files larger than 5 MB. Catches accidental
    # binary drops (logs, dataset samples, build artifacts).

    check-large-files:
      glob: "**/*"
      run: |
        threshold=$((5 * 1024 * 1024))   # 5 MB
        bad=$(mktemp)
        # `git diff --name-only` is one file per line (newlines in filenames
        # are pathological and rare; rare enough that a line-based scan is
        # good enough for the common case).
        git diff --cached --name-only | while IFS= read -r f; do
          [ -f "$f" ] || continue
          size=$(wc -c < "$f")
          if [ "$size" -gt "$threshold" ]; then
            mb=$(( size / 1024 / 1024 ))
            echo "ERROR: $f is ${mb} MB — exceeds 5 MB limit. Use git-lfs or store externally." >&2
            echo "$f" >> "$bad"
          fi
        done
        if [ -s "$bad" ]; then
          rm -f "$bad"
          exit 1
        fi
        rm -f "$bad"

# ────────────────────────────────────────────────────────────────────────────
# commit-msg: validate the commit message format.
# Script lives at .lefthook/commit-msg/check-conventional-commit.sh and is
# resolved relative to this repo's root by lefthook.
# ────────────────────────────────────────────────────────────────────────────
commit-msg:
  parallel: false
  scripts:
    "check-conventional-commit.sh":
      runner: bash
      args: "{0}"

# ────────────────────────────────────────────────────────────────────────────
# pre-push: full re-verification before code leaves the machine.
# Gated on go.mod — runs only on Go projects.
# ────────────────────────────────────────────────────────────────────────────
pre-push:
  parallel: false
  commands:
    go-test-race:
      run: go test -race -count=1 ./...
      skip:
        - run: "! command -v go"
        - run: "test ! -f go.mod"

    golangci-lint:
      run: |
        if command -v golangci-lint >/dev/null 2>&1; then
          golangci-lint run --timeout 10m ./...
        else
          echo "golangci-lint not installed; skipping (CI will catch issues)"
        fi
      skip:
        - run: "! command -v go"
        - run: "test ! -f go.mod"
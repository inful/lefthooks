# .github/workflows/consumer-validate.yml — REUSABLE workflow.
#
# Runs `lefthook validate` against the calling consumer's lefthook.yml
# to catch corrupted consumer configs before they break local commits.
#
# Consumers invoke this from their own .github/workflows/ci.yml with:
#
#   jobs:
#     validate:
#       uses: inful/lefthooks/.github/workflows/consumer-validate.yml@vX.Y.Z
#
# Bump the @ref to match the version of inful/lefthooks the consumer
# pins in its own lefthook.yml so the workflow and the hook config stay
# in lockstep.

name: Consumer lefthook validate

on:
  workflow_call:

jobs:
  validate:
    name: Validate consumer lefthook.yml
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install lefthook
        run: go install github.com/evilmartians/lefthook/v2@v2.2.2

      - name: Validate consumer config
        # `lefthook validate` reads the merged config (including the
        # remote import from inful/lefthooks) and exits non-zero on
        # any YAML / schema error. Note: this requires the consumer's
        # SSH key for github.com to be reachable; on public repos GitHub
        # Actions' default GITHUB_TOKEN is enough over HTTPS, but
        # inful/* is private, so consumers may need to add an SSH key
        # to fetch the remote config.
        run: lefthook validate